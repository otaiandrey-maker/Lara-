name: Gerar APK da Lara

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto Android
        shell: bash
        run: |
          set -e

          echo "Arquivos disponíveis:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          mkdir -p android_project
          unzip -q "$ZIP_FILE" -d android_project

          echo "Procurando gradlew..."
          GRADLEW=$(find android_project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não foi encontrado dentro do ZIP."
            echo "Estrutura extraída:"
            find android_project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Diretório do projeto:"
          pwd

          echo "Arquivos:"
          ls -la

          echo "Versão do Java:"
          java -version

          echo "Versão do Gradle:"
          ./gradlew --version

      - name: Gerar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lara-APK
          path: android_project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
