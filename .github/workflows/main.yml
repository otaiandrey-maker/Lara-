name: Gerar APK da Lara

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: |
          mkdir -p projeto
          unzip -o Lara_Android_Projeto.zip -d projeto

      - name: Encontrar Gradle
        run: |
          GRADLEW=$(find projeto -name gradlew -type f | head -n 1)

          echo "Gradle encontrado em: $GRADLEW"

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado no projeto."
            echo "Conteúdo do projeto:"
            find projeto -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Dar permissão ao Gradle
        run: chmod +x "$GRADLEW"

      - name: Gerar APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lara-APK
          path: projeto/**/*.apk
          if-no-files-found: error
