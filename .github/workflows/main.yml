name: Gerar APK da Lara

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: |
          mkdir -p projeto
          unzip -o Lara_Android_Projeto.zip -d projeto

      - name: Instalar Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Preparar Gradle
        run: |
          cd projeto
          gradle wrapper
          chmod +x gradlew

      - name: Gerar APK
        run: |
          cd projeto
          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "Procurando APK..."
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lara-APK
          path: projeto/**/*.apk
          if-no-files-found: error
