name: Gerar APK da Lara

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: |
          mkdir -p projeto
          unzip -o Lara_Android_Projeto.zip -d projeto

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar Gradle
        run: |
          cd projeto
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Corrigir Java e Kotlin
        run: |
          cd projeto
          python3 <<'PY'
          from pathlib import Path

          arquivo = Path("app/build.gradle")
          texto = arquivo.read_text()

          texto = texto.replace("\\\\n", "")

          texto += """
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          arquivo.write_text(texto)
          PY

      - name: Gerar APK
        run: |
          cd projeto
          ./gradlew clean assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lara-APK
          path: projeto/**/*.apk
          if-no-files-found: error
