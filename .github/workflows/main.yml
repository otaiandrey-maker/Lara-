name: Gerar APK da Lara

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto da Lara
        run: |
          rm -rf lara
          mkdir lara
          unzip -q Lara_Android_Final_IA_Avatar.zip -d lara

      - name: Gerar APK
        working-directory: lara
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lara-Final-IA-Avatar
          path: lara/app/build/outputs/apk/debug/app-debug.apk
