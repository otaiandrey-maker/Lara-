name: Gerar APK da Lara

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: |
          rm -rf android_project
          mkdir android_project
          unzip -q Lara_Android_Final_IA_Avatar.zip -d android_project

      - name: Gerar APK
        working-directory: android_project
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lara-APK-Final
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
